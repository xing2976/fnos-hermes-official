name: Build fnOS Hermes Agent FPK

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      version:
        description: 'Hermes 上游版本标签 (如 v2026.8.31)'
        required: false
        type: string
      app_version:
        description: 'fpk 应用版本号 (如 0.21.0)'
        required: false
        type: string
      dry_run:
        description: '仅构建不发布'
        required: false
        default: false
        type: boolean

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Read version
        id: version
        run: |
          if [ -n "${{ github.event.inputs.version }}" ]; then
            HERMES_TAG="${{ github.event.inputs.version }}"
          else
            # 从配置文件读取
            HERMES_TAG=$(grep '^HERMES_VERSION=' config/bootstrap/hermes-version.env | cut -d= -f2)
          fi
          
          # 从 app_version 输入获取 fpk 版本号，或从 manifest 读取
          if [ -n "${{ github.event.inputs.app_version }}" ]; then
            APP_VERSION="${{ github.event.inputs.app_version }}"
          else
            APP_VERSION=$(grep '^version' manifest | head -1 | awk '{print $3}')
          fi
          
          echo "hermes_tag=$HERMES_TAG" >> $GITHUB_OUTPUT
          echo "app_version=$APP_VERSION" >> $GITHUB_OUTPUT
          
          echo "Hermes tag: $HERMES_TAG"
          echo "App version: $APP_VERSION"

      - name: Download Hermes Agent source
        run: |
          HERMES_TAG=${{ steps.version.outputs.hermes_tag }}
          echo "下载 Hermes Agent ${HERMES_TAG} 源码..."
          
          # 方法1: 使用 git clone
          if git clone --depth 1 --branch ${HERMES_TAG} https://github.com/NousResearch/hermes-agent.git /tmp/hermes-src 2>/dev/null; then
            echo "下载成功 (git clone)"
          # 方法2: 尝试镜像
          elif git clone --depth 1 --branch ${HERMES_TAG} https://ghproxy.com/https://github.com/NousResearch/hermes-agent.git /tmp/hermes-src 2>/dev/null; then
            echo "下载成功 (ghproxy.com)"
          # 方法3: 使用 tarball from codeload
          else
            echo "尝试 codeload..."
            curl -LsSf "https://codeload.github.com/NousResearch/hermes-agent/tar.gz/${HERMES_TAG}" -o /tmp/hermes-src.tar.gz
            if [ -f /tmp/hermes-src.tar.gz ] && [ $(stat -c%s /tmp/hermes-src.tar.gz 2>/dev/null || stat -f%z /tmp/hermes-src.tar.gz) -gt 1000 ]; then
              mkdir -p /tmp/hermes-src
              tar xzf /tmp/hermes-src.tar.gz -C /tmp/hermes-src --strip-components=1
              echo "下载成功 (codeload)"
            else
              echo "ERROR: 无法下载 Hermes Agent 源码"
              rm -f /tmp/hermes-src.tar.gz
              exit 1
            fi
          fi
          
          if [ ! -d "/tmp/hermes-src" ] || [ ! -f "/tmp/hermes-src/pyproject.toml" ]; then
            echo "ERROR: 无法验证源码完整性"
            exit 1
          fi
          
          # 移动到 app 目录
          rm -rf app
          mv /tmp/hermes-src app
          
          # 创建 app.tgz
          tar czf app.tgz app/
          
          echo "源码下载完成"
          ls -lh app/

      - name: Update manifest
        run: |
          APP_VERSION=${{ steps.version.outputs.app_version }}
          echo "App version: $APP_VERSION"
          
          # 更新 manifest 中的版本号
          sed -i "s/^version.*=.*$/version               = $APP_VERSION/" manifest
          
          echo "Updated manifest:"
          grep "^version" manifest

      - name: Build FPK
        run: |
          chmod +x scripts/build-fpk.sh
          ./scripts/build-fpk.sh ${{ steps.version.outputs.app_version }}

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: fnos-hermes-agent.fpk
          path: dist/fnos-hermes-agent-v*.fpk
          if-no-files-found: error
          archive: false

      - name: Create Release
        if: ${{ !github.event.inputs.dry_run }}
        uses: softprops/action-gh-release@v1
        with:
          files: dist/fnos-hermes-agent-v*.fpk
          tag_name: fnos-${{ steps.version.outputs.app_version }}
          name: Hermes Agent v${{ steps.version.outputs.app_version }} for fnOS
          body: |
            ## Hermes Agent for fnOS
            
            **Hermes 上游版本**: ${{ steps.version.outputs.hermes_tag }}
            **fpk 版本**: ${{ steps.version.outputs.app_version }}
            
            ### 功能特性
            - 内嵌自更新：自动检查 Hermes 上游版本并提示升级
            - 全中文控制面板（端口 9119）
            - 多平台消息网关（微信/飞书/Telegram 等）
            - 技能系统、MCP 扩展与持久记忆
            
            ### 安装方式
            1. 下载本 Release 中的 `.fpk` 文件
            2. 在飞牛 NAS 应用中心选择「手动安装」
            3. 上传 `.fpk` 并完成安装向导
            
            ### 自更新说明
            安装后应用会自动检查 Hermes 上游版本，发现更新时会提示。
            也可手动执行 `hermes agent update` 触发检查。
            
            ---
            基于 [NousResearch/hermes-agent@${{ steps.version.outputs.hermes_tag }}](https://github.com/NousResearch/hermes-agent/tree/${{ steps.version.outputs.hermes_tag }})
