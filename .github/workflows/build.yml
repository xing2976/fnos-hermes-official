name: Build fnOS Hermes Agent FPK

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      version:
        description: '版本号 (如 0.21.0)'
        required: false
        type: string
      dry_run:
        description: '仅构建不发布'
        required: false
        default: false
        type: boolean

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Read version
        id: version
        run: |
          if [ -n "${{ github.event.inputs.version }}" ]; then
            echo "version=${{ github.event.inputs.version }}" >> $GITHUB_OUTPUT
          else
            VERSION=$(grep '^HERMES_VERSION=' config/bootstrap/hermes-version.env | cut -d= -f2)
            echo "version=$VERSION" >> $GITHUB_OUTPUT
          fi

      - name: Download Hermes Agent source
        run: |
          HERMES_VERSION=${{ steps.version.outputs.version }}
          echo "下载 Hermes Agent v${HERMES_VERSION} 源码..."
          
          # 方法1: 使用 git clone 指定 tag
          if git clone --depth 1 --branch v${HERMES_VERSION} https://github.com/NousResearch/hermes-agent.git /tmp/hermes-src 2>/dev/null; then
            echo "下载成功 (git clone)"
          # 方法2: 尝试 ghproxy.com
          elif git clone --depth 1 --branch v${HERMES_VERSION} https://ghproxy.com/https://github.com/NousResearch/hermes-agent.git /tmp/hermes-src 2>/dev/null; then
            echo "下载成功 (ghproxy.com)"
          # 方法3: 尝试 gh-proxy.com
          elif git clone --depth 1 --branch v${HERMES_VERSION} https://gh-proxy.com/https://github.com/NousResearch/hermes-agent.git /tmp/hermes-src 2>/dev/null; then
            echo "下载成功 (gh-proxy.com)"
          # 方法4: 使用 tarball from codeload
          else
            echo "尝试 codeload..."
            curl -LsSf "https://codeload.github.com/NousResearch/hermes-agent/tar.gz/v${HERMES_VERSION}" -o /tmp/hermes-src.tar.gz
            mkdir -p /tmp/hermes-src
            tar xzf /tmp/hermes-src.tar.gz -C /tmp/hermes-src --strip-components=1
          fi
          
          if [ ! -d "/tmp/hermes-src" ] || [ ! -f "/tmp/hermes-src/pyproject.toml" ]; then
            echo "ERROR: 无法下载 Hermes Agent 源码"
            exit 1
          fi
          
          # 移动到 app 目录
          rm -rf app
          mv /tmp/hermes-src app
          
          # 创建 app.tgz
          tar czf app.tgz app/
          
          echo "源码下载完成: $(ls -lh /tmp/hermes-src | head -5)"

      - name: Build FPK
        run: |
          chmod +x scripts/build-fpk.sh
          ./scripts/build-fpk.sh ${{ steps.version.outputs.version }}

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: fnos-hermes-agent
          path: dist/fnos-hermes-agent-v*.fpk

      - name: Create Release
        if: ${{ !github.event.inputs.dry_run }}
        uses: softprops/action-gh-release@v1
        with:
          files: dist/fnos-hermes-agent-v*.fpk
          tag_name: v${{ steps.version.outputs.version }}
          name: Hermes Agent v${{ steps.version.outputs.version }} (fnOS)
          body: |
            ## Hermes Agent for fnOS
            
            版本: ${{ steps.version.outputs.version }}
            
            ### 功能特性
            - 内嵌自更新：自动检查 Hermes 上游版本并提示升级
            - 全中文控制面板（端口 9119）
            - 多平台消息网关（微信/飞书/Telegram 等）
            - 技能系统、MCP 扩展与持久记忆
            
            ### 安装方式
            1. 下载本 Release 中的 `.fpk` 文件
            2. 在飞牛 NAS 应用中心选择「手动安装」
            3. 上传 `.fpk` 并完成安装向导
            
            ### 自更新说明
            安装后应用会自动检查 Hermes 上游版本，发现更新时会提示。
            也可手动执行 `hermes agent update` 触发检查。
            
            ---
            基于 [NousResearch/hermes-agent](https://github.com/NousResearch/hermes-agent) ${{ steps.version.outputs.version }}
